<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Vibe Weather</h1>

    <form id="searchForm" class="search">
      <input id="query" type="text" placeholder="City or ZIP (e.g. Brooklyn or 11211)" autocomplete="off" required>
      <button type="submit">Search</button>
      <button type="button" id="locate" title="Use my location">&#9737;</button>
    </form>

    <div class="units" role="group" aria-label="Units">
      <button type="button" data-units="imperial" class="active">&deg;F</button>
      <button type="button" data-units="metric">&deg;C</button>
    </div>

    <p id="error" class="error" hidden></p>
    <p id="loading" class="loading" hidden>Loading&hellip;</p>

    <section id="current" class="current" hidden>
      <h2 id="location"></h2>
      <div class="now">
        <img id="icon" alt="">
        <div id="temperature" class="temp"></div>
      </div>
      <p id="description" class="description"></p>
      <ul class="details">
        <li>Feels like <strong id="feelsLike"></strong></li>
        <li>Humidity <strong id="humidity"></strong></li>
        <li>Wind <strong id="wind"></strong></li>
        <li>Sunrise <strong id="sunrise"></strong></li>
        <li>Sunset <strong id="sunset"></strong></li>
      </ul>
    </section>

    <section id="forecastSection" hidden>
      <h3>5-Day Forecast</h3>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
