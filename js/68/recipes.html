<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        text-align: center;
      }

      #picture {
        width: 200px;
        height: 200px;
      }

      #ingredients {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .has-recipe {
        display: none;
      }

      #error {
        color: red;
      }
    </style>
  </head>
  <body>
    <header><h1>PCS Recipes</h1></header>
    <hr />
    <select id="recipes">
      <option hidden>select a recipe</option>
    </select>

    <div class="no-recipe">
      <h2>select a delicious recipe</h2>
      <h5 id="error"></h5>
    </div>

    <div class="has-recipe">
      <h2 id="name"></h2>
      <img id="picture" />

      <h5>ingredients</h5>
      <ul id="ingredients"></ul>
    </div>

    <script src="recipes.js" type="module"></script>
  </body>
</html>
